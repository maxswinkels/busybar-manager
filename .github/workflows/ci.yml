name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # web/dist is not in git (see #14): the server serves whatever the developer
  # built locally, and `npm run build` at the root (or scripts/install.sh)
  # produces it. CI proves that web/src still builds so a broken frontend
  # change does not surface only on the next person's machine.
  build:
    name: Dashboard builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install frontend dependencies
        working-directory: web
        run: npm ci

      - name: Build the dashboard
        working-directory: web
        run: npm run build

      - name: Check the build produced a dashboard
        run: test -f web/dist/index.html

  macos-app:
    name: macOS app compiles
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Type-check the native launcher
        run: |
          swiftc -warnings-as-errors \
            -target "$(uname -m)-apple-macosx26.0" \
            -sdk "$(xcrun --sdk macosx --show-sdk-path)" \
            -typecheck -framework AppKit macos/BusyBarManager.swift

      - name: Validate deployment files
        run: |
          plutil -lint macos/Info.plist launchd/nl.backspaced.busybar-manager.plist
          bash -n scripts/install.sh scripts/uninstall.sh
