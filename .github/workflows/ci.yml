name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # web/dist is not in git (see #14): the server serves whatever the developer
  # built locally, and `npm run build` at the root (or scripts/install.sh)
  # produces it. Nothing here can go stale anymore, so all CI has to prove is
  # that web/src still builds: a broken frontend change would otherwise only
  # surface on the next person's machine.
  build:
    name: Dashboard builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install frontend dependencies
        working-directory: web
        run: npm ci

      - name: Build the dashboard
        working-directory: web
        run: npm run build

      - name: Check the build produced a dashboard
        run: test -f web/dist/index.html
